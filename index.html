<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB Helper</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wb: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87',
                            950: '#3b0764'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0f111a;
            --glow-1: radial-gradient(circle, rgba(255, 0, 85, 0.45) 0%, rgba(255, 0, 85, 0) 70%);
            --glow-2: radial-gradient(circle, rgba(62, 166, 255, 0.45) 0%, rgba(62, 166, 255, 0) 70%);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-page: #e8ecf2;
                --glow-1: radial-gradient(circle, rgba(255, 120, 150, 0.5) 0%, rgba(255, 255, 255, 0) 70%);
                --glow-2: radial-gradient(circle, rgba(120, 180, 255, 0.5) 0%, rgba(255, 255, 255, 0) 70%);
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-1 {
            top: 50%;
            left: 50%;
            transform: translate(-110%, -90%);
            width: 400px;
            height: 400px;
            background: var(--glow-1);
        }

        .bg-glow-2 {
            top: 50%;
            left: 50%;
            transform: translate(10%, -10%);
            width: 450px;
            height: 450px;
            background: var(--glow-2);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.2);
        }

        .whitespace-pre-line {
            white-space: pre-line;
        }

        .rich-content a {
            color: #c084fc;
            text-decoration: underline;
            font-weight: 500;
        }

        .rich-content a:hover {
            color: #e879f9;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="bg-slate-950/60 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetApp()">
                <svg class="w-7 h-7 text-purple-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6m4 0h.01M17 12h.01"/>
                </svg>
                <div>
                    <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">WB Helper</h1>
                </div>
            </div>
            
            <div class="flex items-center space-x-2.5">
                <label class="cursor-pointer text-slate-300 hover:text-white bg-slate-800/60 border border-slate-700 p-1.5 rounded-lg transition-all flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    <input type="file" accept=".xlsx, .xls" onchange="importExcel(event)" class="hidden">
                </label>

                <button id="header-admin-btn" onclick="openLoginModal()" class="text-xs text-slate-300 hover:text-white font-medium bg-slate-800/60 border border-slate-700 px-3 py-1.5 rounded-lg transition-all flex items-center space-x-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span>Вход</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 flex flex-col justify-center relative z-10">
        <div class="glass-card rounded-3xl shadow-2xl overflow-hidden transition-all duration-300">
            <div class="bg-slate-900/60 px-6 py-4 border-b border-slate-700/60 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span id="step-badge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">Меню</span>
                    <h2 id="step-title" class="text-sm sm:text-base font-bold text-white"></h2>
                </div>
                <div id="step-counter" class="text-xs text-slate-400 font-medium"></div>
            </div>

            <div id="wizard-content" class="p-6 sm:p-8"></div>

            <div id="wizard-footer" class="bg-slate-900/40 px-6 py-4 border-t border-slate-700/60 flex items-center justify-between hidden">
                <button id="btn-back" onclick="goBack()" class="glass-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-200 flex items-center space-x-2">
                    <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    <span>Назад</span>
                </button>
                <div class="ml-auto">
                    <button onclick="resetApp()" class="glass-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-200 flex items-center space-x-2">
                        <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        <span>Вернуться в начало</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="login-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden overflow-y-auto flex flex-col items-center justify-start sm:justify-center p-4">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-6 border border-purple-500/30 my-auto">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <span>Вход</span>
                </h3>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="admin-password" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition-all">
                </div>
                <div class="flex space-x-3">
                    <button type="submit" class="w-1/2 py-3 bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm rounded-xl transition-all shadow-lg shadow-purple-900/40">Войти</button>
                    <button type="button" onclick="closeLoginModal()" class="w-1/2 py-3 glass-btn text-slate-300 hover:text-white text-sm rounded-xl">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let db = {
            categories: [],
            steps: {},
            results: {}
        };

        function saveDb() {
            localStorage.setItem('wb_moderation_db', JSON.stringify(db));
        }

        let state = {
            view: 'menu',
            isAdmin: false,
            categoryId: null,
            stepId: 'step_1',
            history: []
        };

        const iconNoteSVG = `<svg class="w-full h-full" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0ZM10 5C9.69996 5 9.4262 5.17091 9.29297 5.44043L8.16895 7.6875L5.67969 8.04395C5.37993 8.08615 5.13078 8.29704 5.03809 8.58594C4.94557 8.8748 5.02609 9.19099 5.24512 9.40039L7.03711 11.123L6.61133 13.5693C6.55871 13.8664 6.67988 14.1683 6.92188 14.3467C7.16453 14.525 7.48719 14.5487 7.75391 14.4092L10 13.2471L12.2461 14.4102C12.5128 14.5496 12.8355 14.525 13.0781 14.3467C13.3207 14.1683 13.4412 13.8672 13.3887 13.5703L12.9629 11.123L14.7549 9.40039C14.9739 9.19099 15.0544 8.8748 14.9619 8.58594C14.8692 8.29704 14.6201 8.08615 14.3203 8.04395L11.8311 7.6875L10.707 5.44043C10.5738 5.17091 10.3 5 10 5Z" fill="currentColor"/></svg>`;
        
        const iconClarificationSVG = `<svg class="w-full h-full" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.4772 19.9999 0 15.5228 0 10C0 4.47719 4.4772 5.59549e-05 10 0ZM10.001 4.5C8.16054 4.49953 6.55685 5.80579 6.11621 7.66504C5.67565 9.52437 6.51186 11.4569 8.1416 12.3467V14.0137C8.1416 14.8345 8.78146 15.5 9.57031 15.5H10.4277C11.2165 15.4998 11.8555 14.8344 11.8555 14.0137V12.3477C13.4859 11.459 14.3232 9.52768 13.8838 7.66797C13.4443 5.80824 11.8416 4.50059 10.01 4.5Z" fill="currentColor"/></svg>`;

        const iconWarningSVG = `<svg class="w-full h-full" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0ZM10.6348 5.12598C10.6346 4.51314 9.8327 4.26713 9.47852 4.77051L5.61426 10.2686C5.32239 10.6833 5.62401 11.25 6.13574 11.25H9.36621V14.874C9.36639 15.4868 10.1673 15.7328 10.5215 15.295L14.3857 9.73145C14.6769 9.31678 14.3761 8.7503 13.8652 8.75H10.6348V5.12598Z" fill="currentColor"/></svg>`;
        
        const iconAlertSVG = `<svg class="w-full h-full" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.4772 19.9999 0 15.5228 0 10C0 4.47719 4.4772 5.59226e-05 10 0ZM10.4004 4.25684C10.3499 4.2318 10.2933 4.27661 10.3018 4.33398C10.5501 6.07192 10.207 7.96286 8.19727 8.69141C8.18577 8.69568 8.17251 8.69203 8.16504 8.68164C7.81565 8.18906 7.7279 7.34267 7.70605 7.01758C7.70203 6.95463 7.63491 6.92 7.58203 6.95117C6.50225 7.5966 5.50016 9.1216 5.5 10.5947C5.5 13.1266 7.15366 15.25 10 15.25C12.667 15.25 14.5 13.0616 14.5 10.5957C14.5 7.36967 12.3316 5.2255 10.4004 4.25684Z" fill="currentColor"/></svg>`;

        const iconCommentSVG = `<svg class="w-full h-full" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0ZM10.25 5C7.62665 5 5.5 7.12665 5.5 9.75C5.49946 10.8143 5.8586 11.8477 6.51855 12.6826L5.64453 13.6104C5.5002 13.7637 5.46046 13.9883 5.54395 14.1816C5.62745 14.3749 5.81872 14.5 6.0293 14.5H10.25C12.8734 14.5 15 12.3734 15 9.75C15 7.12665 12.8734 5 10.25 5Z" fill="currentColor"/></svg>`;

        const iconSuccessSVG = `<svg class="w-full h-full" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0ZM14.1213 7.12132C13.7308 6.7308 13.0976 6.7308 12.7071 7.12132L8.5 11.3284L7.29289 10.1213C6.90237 9.73078 6.2692 9.73078 5.87868 10.1213C5.48816 10.5118 5.48816 11.145 5.87868 11.5355L7.79289 13.4497C8.18342 13.8402 8.81658 13.8402 9.20711 13.4497L14.1213 8.53553C14.5 8.145 14.5 7.51184 14.1213 7.12132Z" fill="currentColor"/></svg>`;
        
        const iconInfoSVG = `<svg class="w-full h-full" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0ZM9 9V15H11V9H9ZM10 4C9.44772 4 9 4.44772 9 5C9 5.55228 9.44772 6 10 6C10.5523 6 11 5.55228 11 5C11 4.44772 10.5523 4 10 4Z" fill="currentColor"/></svg>`;

        function openLoginModal() {
            if (state.isAdmin) {
                state.view = 'admin';
                render();
                return;
            }
            document.getElementById('login-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function handleLogin(e) {
            e.preventDefault();
            const pwd = document.getElementById('admin-password').value;
            if (pwd === '1671') {
                state.isAdmin = true;
                state.view = 'admin';
                closeLoginModal();
                document.getElementById('header-admin-btn').innerHTML = `
                    <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    <span>Панель</span>
                `;
                render();
            }
        }

        function logoutAdmin() {
            state.isAdmin = false;
            resetApp();
            document.getElementById('header-admin-btn').innerHTML = `
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                <span>Вход</span>
            `;
        }

        function resetApp() {
            state.view = 'menu';
            state.categoryId = null;
            state.stepId = 'step_1';
            state.history = [];
            render();
        }

        function selectCategory(catId) {
            state.categoryId = catId;
            state.stepId = 'step_1';
            state.history = [];
            
            const catObj = db.categories.find(c => c.id === catId);
            if (catObj && catObj.hasIntro) {
                state.view = 'intro';
            } else {
                state.view = 'wizard';
            }
            render();
        }

        function startFromIntro() {
            state.view = 'wizard';
            render();
        }

        function goBack() {
            if (state.view === 'wizard' && state.history.length === 0) {
                const catObj = db.categories.find(c => c.id === state.categoryId);
                if (catObj && catObj.hasIntro) {
                    state.view = 'intro';
                    render();
                    return;
                }
            }

            if (state.history.length > 0) {
                state.stepId = state.history.pop();
                state.view = 'wizard';
                render();
            } else {
                resetApp();
            }
        }

        function makeChoice(nextTarget) {
            state.history.push(state.stepId);
            if (nextTarget.startsWith('res_')) {
                state.view = 'result';
                state.resultId = nextTarget;
            } else {
                state.stepId = nextTarget;
                state.view = 'wizard';
            }
            render();
        }

        function insertTag(fieldId, openTag, closeTag) {
            let field = document.getElementById(fieldId);
            if (!field) return;
            let start = field.selectionStart;
            let end = field.selectionEnd;
            let val = field.value;
            let selectedText = val.substring(start, end);
            let replacement = openTag + selectedText + closeTag;
            field.value = val.substring(0, start) + replacement + val.substring(end);
            field.focus();
            field.setSelectionRange(start + openTag.length, end + openTag.length);
        }

        function insertLinkTag(fieldId) {
            let url = prompt('🔗 Введите URL:', 'https://');
            if (!url) return;
            let field = document.getElementById(fieldId);
            if (!field) return;
            let start = field.selectionStart;
            let end = field.selectionEnd;
            let val = field.value;
            let selectedText = val.substring(start, end) || 'текст ссылки';
            let replacement = `<a href="${url}" target="_self">${selectedText}</a>`;
            field.value = val.substring(0, start) + replacement + val.substring(end);
            field.focus();
        }

        function renderEditorToolbar(fieldId) {
            return `
                <div class="flex items-center space-x-1.5">
                    <button type="button" onclick="insertTag('${fieldId}', '<b>', '</b>')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs font-bold">B</button>
                    <button type="button" onclick="insertTag('${fieldId}', '<i>', '</i>')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs italic">I</button>
                    <button type="button" onclick="insertLinkTag('${fieldId}')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded text-xs">🔗</button>
                    <button type="button" onclick="insertTag('${fieldId}', '<br>', '')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs font-mono">↵ br</button>
                </div>
            `;
        }

        function render() {
            const content = document.getElementById('wizard-content');
            const badge = document.getElementById('step-badge');
            const titleEl = document.getElementById('step-title');
            const counter = document.getElementById('step-counter');
            const footer = document.getElementById('wizard-footer');

            if (state.view === 'menu') {
                footer.classList.add('hidden');
                badge.textContent = 'Меню';
                badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30';
                titleEl.textContent = '';
                counter.textContent = '';

                let html = `<div class="space-y-4">`;
                
                let sortedCats = [...db.categories].sort((a, b) => (a.order || 0) - (b.order || 0));
                if (sortedCats.length === 0) {
                    html += `
                        <div class="text-center py-10 space-y-4">
                            <p class="text-sm text-slate-300">Загрузите файл, чтобы начать работу.</p>
                            <div>
                                <label class="cursor-pointer inline-flex items-center px-5 py-3 bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium rounded-xl transition-all shadow-lg shadow-purple-900/40">
                                    <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    showAlertModal('🚨', 'Укажите ID шага');
                    return;
                }
                if (!db.steps[catId]) db.steps[catId] = {};
                if (db.steps[catId][sKey]) {
                    showAlertModal('🚨', 'Шаг с таким ID уже существует в этом блоке');
                    return;
                }

                let title = document.getElementById('m-s-title').value.trim();
                let desc = document.getElementById('m-s-desc').value.trim();

                let clarificationNotice = document.getElementById('m-s-clarificationnotice').value.trim();

                db.steps[catId][sKey] = {
                    title,
                    desc,
                    blueNotice,
                    clarificationNotice,
                    orangeNotice,
                    redNotice,
                    commentNotice,
                    answers: newAnswers.length > 0 ? newAnswers : [{ text: 'Да', next: 'res_1' }]
                };

                saveDb();
            });
        }

        function deleteStep(catId, stepKey) {
            let keys = Object.keys(db.steps[catId] || {});
            if (keys.length <= 1) {
                showAlertModal('🚨 Удаление', 'В блоке должен остаться хотя бы один шаг');
                return;
            }
            showConfirmModal('🚨 Внимание', `Удалить шаг [${stepKey}]?`, () => {
                delete db.steps[catId][stepKey];
                let stepsMap = db.steps[catId] || {};
                for (let sKey in stepsMap) {
                    let step = stepsMap[sKey];
                    if (step.answers) {
                        step.answers.forEach(ans => {
                            if (ans.next === stepKey) ans.next = 'res_1';
                        });
                    }
                }
                saveDb();
            });
        }

        function deleteResult(catId, resKey) {
            let resKeys = Object.keys(db.results[catId] || {});
            if (resKeys.length <= 1) {
                showAlertModal('🚨 Удаление', 'В блоке должно остаться хотя бы одно решение');
                return;
            }
            showConfirmModal('🚨 Внимание', `Удалить решение [${resKey}]?`, () => {
                delete db.results[catId][resKey];
                let remainingResKeys = Object.keys(db.results[catId] || {});
                let fallbackRes = remainingResKeys[0] || 'res_1';

                let stepsMap = db.steps[catId] || {};
                for (let sKey in stepsMap) {
                    let step = stepsMap[sKey];
                    if (step.answers) {
                        step.answers.forEach(ans => {
                            if (ans.next === resKey) ans.next = fallbackRes;
                        });
                    }
                }
                saveDb();
            });
        }

        function exportExcel() {
            let wb = XLSX.utils.book_new();

            let catData = db.categories.map(c => ({
                'ID': c.id,
                'Название': c.name,
                'Описание': c.desc,
                'Колонок': c.cols,
                'Порядок': c.order,
                'Есть примечание (Да/Нет)': c.hasIntro ? 'Да' : 'Нет',
                'Текст примечания': c.introText
            }));
            let wsCat = XLSX.utils.json_to_sheet(catData);
            XLSX.utils.book_append_sheet(wb, wsCat, "Категории");

            let validCatIds = new Set(db.categories.map(c => c.id));

            let stepRows = [];
            for (let catId in db.steps) {
                if (!validCatIds.has(catId)) continue;
                let steps = db.steps[catId];
                for (let sKey in steps) {
                    let s = steps[sKey];
                    let ansStr = (s.answers || []).map(a => `${a.text} -> ${a.next}`).join(' | ');
                    stepRows.push({
                        'ID Категории': catId,
                        'ID Шага': sKey,
                        'Заголовок вопроса': s.title,
                        'Описание': s.desc,
                        'Примечание': s.blueNotice || '',
                        'Уточнение': s.clarificationNotice || '',
                        'Внимание': s.orangeNotice || '',
                        'Важно': s.redNotice || '',
                        'Комментарий': s.commentNotice || '',
                        'Ответы (Ответ -> Куда)': ansStr
                    });
                }
            }
            let wsStep = XLSX.utils.json_to_sheet(stepRows);
            XLSX.utils.book_append_sheet(wb, wsStep, "Шаги");

            let resRows = [];
            for (let catId in db.results) {
                if (!validCatIds.has(catId)) continue;
                let results = db.results[catId];
                for (let rKey in results) {
                    let r = results[rKey];
                    resRows.push({
                        'ID Категории': catId,
                        'ID Решения': rKey,
                        'Заголовок решения': r.title,
                        'Описание': r.desc,
                        'Примечание': r.blueNotice || '',
                        'Уточнение': r.clarificationNotice || '',
                        'Внимание': r.orangeNotice || '',
                        'Важно': r.redNotice || '',
                        'Комментарий': r.commentNotice || '',
                        'Успешный (Да/Нет)': r.isSuccess ? 'Да' : 'Нет'
                    });
                }
            }
            let wsRes = XLSX.utils.json_to_sheet(resRows);
            XLSX.utils.book_append_sheet(wb, wsRes, "Решения");

            XLSX.writeFile(wb, "wb_helper.xlsx");
        }

        function parseWorkbook(workbook) {
            let newCategories = [];
            let newSteps = {};
            let newResults = {};

            if (workbook.Sheets["Категории"]) {
                let catJson = XLSX.utils.sheet_to_json(workbook.Sheets["Категории"]);
                newCategories = catJson
                    .filter(row => row && (row['ID'] || row['Название']))
                    .map(row => ({
                        id: String(row['ID'] || ('cat_' + Date.now() + Math.random())).trim(),
                        name: String(row['Название'] || '').trim(),
                        desc: String(row['Описание'] || '').trim(),
                        cols: parseInt(row['Колонок']) || 3,
                        order: parseInt(row['Порядок']) || 1,
                        hasIntro: String(row['Есть примечание (Да/Нет)'] || '').toLowerCase() === 'да',
                        introText: String(row['Текст примечания'] || '').trim()
                    }));
            }

            if (workbook.Sheets["Шаги"]) {
                let stepJson = XLSX.utils.sheet_to_json(workbook.Sheets["Шаги"]);
                stepJson.forEach(row => {
                    let catId = String(row['ID Категории'] || '').trim();
                    let sKey = String(row['ID Шага'] || '').trim();
                    if (!catId || !sKey) return;

                    if (!newSteps[catId]) newSteps[catId] = {};

                    let rawAns = String(row['Ответы (Ответ -> Куда)'] || '');
                    let answers = [];
                    rawAns.split('|').forEach(part => {
                        let sub = part.split('->');
                        if (sub.length === 2) {
                            answers.push({ text: sub[0].trim(), next: sub[1].trim() });
                        }
                    });
                    if (answers.length === 0) answers = [{ text: 'Да', next: 'res_1' }];

                    newSteps[catId][sKey] = {
                        title: String(row['Заголовок вопроса'] || '').trim(),
                        desc: String(row['Описание'] || '').trim(),
                        blueNotice: String(row['Примечание'] || '').trim(),
                        clarificationNotice: String(row['Уточнение'] || '').trim(),
                        orangeNotice: String(row['Внимание'] || '').trim(),
                        redNotice: String(row['Важно'] || '').trim(),
                        commentNotice: String(row['Комментарий'] || '').trim(),
                        answers: answers
                    };
                });
            }

            if (workbook.Sheets["Решения"]) {
                let resJson = XLSX.utils.sheet_to_json(workbook.Sheets["Решения"]);
                resJson.forEach(row => {
                    let catId = String(row['ID Категории'] || '').trim();
                    let rKey = String(row['ID Решения'] || '').trim();
                    if (!catId || !rKey) return;

                    if (!newResults[catId]) newResults[catId] = {};

                    newResults[catId][rKey] = {
                        title: String(row['Заголовок решения'] || '').trim(),
                        desc: String(row['Описание'] || '').trim(),
                        blueNotice: String(row['Примечание'] || '').trim(),
                        clarificationNotice: String(row['Уточнение'] || '').trim(),
                        orangeNotice: String(row['Внимание'] || '').trim(),
                        redNotice: String(row['Важно'] || '').trim(),
                        commentNotice: String(row['Комментарий'] || '').trim(),
                        isSuccess: String(row['Успешный (Да/Нет)'] || '').toLowerCase() === 'да'
                    };
                });
            }

            if (newCategories.length > 0) {
                let validCatIds = new Set(newCategories.map(c => c.id));
                let filteredSteps = {};
                for (let catId in newSteps) {
                    if (validCatIds.has(catId)) {
                        filteredSteps[catId] = newSteps[catId];
                    }
                }

                let filteredResults = {};
                for (let catId in newResults) {
                    if (validCatIds.has(catId)) {
                        filteredResults[catId] = newResults[catId];
                    }
                }

                db = { categories: newCategories, steps: filteredSteps, results: filteredResults };
                saveDb();
                resetApp();
            } else {
                showAlertModal('🚨', 'В файле не найдены категории');
            }
        }

        function importExcel(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    parseWorkbook(workbook);
                } catch(err) {
                    showAlertModal('🚨', 'Не удалось открыть файл: ' + err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = function() {
            fetch('wb_helper.xlsx')
                .then(response => {
                    if (!response.ok) throw new Error('Файл не найден');
                    return response.arrayBuffer();
                })
                .then(data => {
                    let workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
                    parseWorkbook(workbook);
                })
                .catch(error => {
                    console.log('Автозагрузка Excel не удалась, загрузка из localStorage:', error);
                    const savedDb = localStorage.getItem('wb_moderation_db');
                    if (savedDb) {
                        try { 
                            let parsed = JSON.parse(savedDb);
                            if (parsed && parsed.categories) {
                                db = parsed;
                            }
                        } catch(e) { console.error(e); }
                    }
                    render();
                });
        };
    </script>
